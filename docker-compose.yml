services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://server:8000
      NEXTAUTH_URL: http://localhost:3001
    command: npm run dev

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/papunto
      POINTS_PER_SOL: "100"
      MIN_WITHDRAWAL_POINTS: "500"
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      FRONTEND_ORIGIN: http://localhost:3001   # webの公開ポートに合わせる（CORS許可）
      RELOADLY_SANDBOX: "true"
      # 開発用。メールを送らずログにリンクを出す。**本番では絶対に有効にしない**
      MAGIC_LINK_DEV_ECHO: "true"
      CPALEAD_MOCK: "true"
      PUBLIC_BASE_URL: http://localhost:8000   # モックのオファーURL組み立てに使う（ブラウザから開ける必要がある）
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: papunto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
